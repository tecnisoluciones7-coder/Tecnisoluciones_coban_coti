<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#062a57">
    <title>Catálogo | TECNISOLUCIONES COBÁN</title>
    <link rel="icon" type="image/jpeg" href="/img/tecnisoluciones-coban.jpg">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
      body {
        background: linear-gradient(180deg, #edf4fb 0%, #f6f9fc 100%);
      }

      .catalog-topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        min-height: 76px;
        padding: 12px max(24px, calc((100vw - 1340px) / 2));
        background: linear-gradient(108deg, #041d40, #0b4e99);
        box-shadow: 0 3px 18px rgba(2, 22, 51, 0.24);
      }

      .catalog-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #fff;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-decoration: none;
      }

      .catalog-brand-mark {
        display: grid;
        width: 35px;
        height: 35px;
        border: 2px solid #7ee6ed;
        border-radius: 11px;
        place-items: center;
        color: #7ee6ed;
        font-size: 21px;
        font-style: italic;
      }

      .catalog-brand b {
        color: #7ee6ed;
        font-size: 10px;
        letter-spacing: 0.12em;
      }

      .catalog-shell {
        width: min(1280px, calc(100% - 40px));
        margin: 0 auto;
        padding: 36px 0 70px;
      }

      .catalog-hero {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }

      .catalog-hero h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 42px);
        letter-spacing: -0.045em;
      }

      .catalog-hero p {
        color: var(--muted);
        margin: 8px 0 0;
        font-size: 15px;
      }

      .catalog-layout {
        display: grid;
        grid-template-columns: 1.7fr 0.95fr;
        gap: 24px;
      }

      .catalog-panel {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .catalog-toolbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px 20px 0;
        margin-bottom: 20px;
      }

      .catalog-select {
        min-width: 210px;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
        color: var(--ink);
        padding: 0 12px;
      }

      .catalog-products {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 16px;
        padding: 0 20px 20px;
      }

      .catalog-item {
        display: flex;
        flex-direction: column;
        min-height: 226px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .catalog-item h2 {
        margin: 9px 0;
        font-size: 18px;
      }

      .catalog-item p {
        flex: 1;
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.5;
        font-size: 13px;
      }

      .catalog-item-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .catalog-item-price {
        color: var(--blue-dark);
        font-size: 20px;
        font-weight: 850;
        letter-spacing: -0.04em;
      }

      .catalog-side {
        padding: 18px;
      }

      .catalog-cart {
        display: grid;
        gap: 12px;
        margin: 16px 0;
      }

      .catalog-cart-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 12px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f8fbff;
      }

      .catalog-cart-item strong {
        display: block;
        font-size: 14px;
      }

      .catalog-cart-meta {
        color: var(--muted);
        font-size: 12px;
      }

      .catalog-cart-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .catalog-cart-controls button {
        width: 26px;
        height: 26px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
      }

      .catalog-total {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        margin-top: 8px;
        color: var(--muted);
        font-weight: 700;
      }

      .catalog-total strong {
        color: var(--blue-dark);
        font-size: 28px;
        letter-spacing: -0.05em;
      }

      .catalog-form {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }

      .catalog-form label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .catalog-form input,
      .catalog-form textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        background: #fff;
        color: var(--ink);
      }

      .catalog-form textarea {
        min-height: 88px;
        resize: vertical;
      }

      .catalog-empty {
        padding: 26px 20px 30px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 920px) {
        .catalog-layout {
          grid-template-columns: 1fr;
        }

        .catalog-toolbar {
          flex-direction: column;
          align-items: stretch;
        }

        .catalog-select {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="catalog-topbar">
      <div class="catalog-brand">
        <span class="catalog-brand-mark">T</span>
        <span>TECNISOLUCIONES <b>CATÁLOGO</b></span>
      </div>
      <span class="chip">Cotizaciones en línea</span>
    </header>

    <main class="catalog-shell">
      <section class="catalog-hero">
        <div>
          <p class="overline">Soluciones tecnológicas</p>
          <h1>Catálogo de productos</h1>
          <p>Explora productos y servicios para seguridad, conectividad y automatización.</p>
        </div>
      </section>

      <div class="catalog-layout">
        <section class="catalog-panel">
          <div class="catalog-toolbar">
            <label class="search" aria-label="Buscar productos">
              <span>Buscar</span>
              <input id="catalog-search" type="search" placeholder="Buscar productos">
            </label>
            <select id="catalog-category" class="catalog-select" aria-label="Filtrar por categoría">
              <option value="all">Todas las categorías</option>
            </select>
          </div>

          <div class="catalog-products" id="catalog-products"></div>
          <div class="catalog-empty hidden" id="catalog-empty">No hay productos que coincidan con la búsqueda.</div>
        </section>

        <aside class="catalog-panel catalog-side">
          <div class="panel-header">
            <h2>Simulador de cotización</h2>
            <span class="chip" id="catalog-item-count">0 artículos</span>
          </div>

          <div class="catalog-cart" id="catalog-cart"></div>

          <div class="catalog-total">
            <span>Total estimado</span>
            <strong id="catalog-total">Q 0.00</strong>
          </div>

          <form id="catalog-quote-form" class="catalog-form">
            <label>
              Nombre o empresa
              <input id="catalog-client-name" type="text" maxlength="180" placeholder="Ej. Empresa ABC" required>
            </label>
            <label>
              Correo electrónico
              <input id="catalog-client-email" type="email" maxlength="120" placeholder="correo@ejemplo.com" required>
            </label>
            <label>
              Comentarios
              <textarea id="catalog-notes" placeholder="Descripción, fechas o requerimientos específicos..."></textarea>
            </label>
            <button class="button primary large" type="submit">Solicitar cotización</button>
          </form>
        </aside>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const state = { products: [], cart: [] };
      const money = new Intl.NumberFormat('es-GT', { style: 'currency', currency: 'GTQ', minimumFractionDigits: 2 });
      const $ = (selector) => document.querySelector(selector);

      document.addEventListener('DOMContentLoaded', init);

      async function init() {
        bindEvents();
        await loadProducts();
      }

      function bindEvents() {
        $('#catalog-search').addEventListener('input', renderProducts);
        $('#catalog-category').addEventListener('change', renderProducts);
        $('#catalog-products').addEventListener('click', handleProductAction);
        $('#catalog-cart').addEventListener('click', handleCartAction);
        $('#catalog-quote-form').addEventListener('submit', submitQuoteRequest);
      }

      async function loadProducts() {
        try {
          const response = await fetch('/api/productos', { credentials: 'same-origin' });
          const content = await response.json();
          if (!response.ok) throw new Error(content.message || 'No se pudieron cargar los productos.');
          state.products = Array.isArray(content) ? content : [];
          renderCategoryOptions();
          renderProducts();
          renderCart();
        } catch (error) {
          notify(error.message || 'Error al cargar productos.', 'error');
        }
      }

      function renderCategoryOptions() {
        const categories = ['all', ...new Set(state.products.map(inferCategory))];
        const select = $('#catalog-category');
        select.innerHTML = categories.map((category) => {
          const label = category === 'all' ? 'Todas las categorías' : category;
          return `<option value="${category === 'all' ? 'all' : label}">${label}</option>`;
        }).join('');
      }

      function inferCategory(product) {
        if (product.tipo === 'Servicio') return 'Servicios';
        
        const text = `${product.nombre || ''} ${product.descripcion || ''}`.toLowerCase();
        if (/(router|switch|red|conectividad|poe|ethernet|acceso)/.test(text)) return 'Red y conectividad';
        if (/(balun|cable|fuente|kit|accesorio|montaje)/.test(text)) return 'Accesorios';
        return 'Productos';
      }

      function renderProducts() {
        const query = $('#catalog-search').value.trim().toLowerCase();
        const selectedCategory = $('#catalog-category').value;

        const filtered = state.products.filter((product) => {
          const matchesText = `${product.nombre} ${product.descripcion || ''}`.toLowerCase().includes(query);
          const matchesCategory = selectedCategory === 'all' || inferCategory(product) === selectedCategory;
          return matchesText && matchesCategory;
        });

        $('#catalog-products').innerHTML = filtered.map((product) => `
          <article class="catalog-item">
            <h2>${escapeHtml(product.nombre)}</h2>
            <p>${escapeHtml(product.descripcion || 'Sin descripción.')}</p>
            <p style="font-size: 13px; color: #64748b; margin-bottom: 8px;">
              ${product.tipo === 'Servicio' ? 'Stock: N/A' : `Stock: ${product.stock !== undefined ? product.stock : 0}`}
            </p>
            <div class="catalog-item-footer">
              <strong class="catalog-item-price">${formatMoney(product.precio)}</strong>
              <button class="small-button add" data-action="add" data-id="${product.id}">Agregar</button>
            </div>
          </article>
        `).join('');

        $('#catalog-empty').classList.toggle('hidden', filtered.length > 0);
      }

      function handleProductAction(event) {
        const button = event.target.closest('[data-action]');
        if (!button) return;
        const product = state.products.find((item) => String(item.id) === String(button.dataset.id));
        if (!product) return;
        if (button.dataset.action === 'add') addToCart(product);
      }

      function addToCart(product) {
        const existing = state.cart.find((item) => item.productoId === product.id);
        if (existing) {
          existing.cantidad += 1;
        } else {
          state.cart.push({ productoId: product.id, nombre: product.nombre, precio: Number(product.precio), cantidad: 1 });
        }
        renderCart();
        notify(`${product.nombre} agregado al simulador.`, 'success');
      }

      function handleCartAction(event) {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const id = Number(button.dataset.id);
        const item = state.cart.find((entry) => entry.productoId === id);
        if (!item) return;

        if (button.dataset.action === 'increase') item.cantidad += 1;
        if (button.dataset.action === 'decrease') item.cantidad -= 1;
        if (button.dataset.action === 'remove' || item.cantidad <= 0) {
          state.cart = state.cart.filter((entry) => entry.productoId !== id);
        }
        renderCart();
      }

      function renderCart() {
        const totalItems = state.cart.reduce((sum, item) => sum + item.cantidad, 0);
        const total = state.cart.reduce((sum, item) => sum + item.precio * item.cantidad, 0);

        $('#catalog-item-count').textContent = `${totalItems} artículo${totalItems === 1 ? '' : 's'}`;
        $('#catalog-total').textContent = formatMoney(total);

        if (!state.cart.length) {
          $('#catalog-cart').innerHTML = '<div class="catalog-empty">Tu simulador está vacío. Agrega productos para calcular una cotización.</div>';
          return;
        }

        $('#catalog-cart').innerHTML = state.cart.map((item) => `
          <div class="catalog-cart-item">
            <div>
              <strong>${escapeHtml(item.nombre)}</strong>
              <div class="catalog-cart-meta">${formatMoney(item.precio * item.cantidad)}</div>
            </div>
            <div class="catalog-cart-controls">
              <button type="button" data-action="decrease" data-id="${item.productoId}">−</button>
              <span>${item.cantidad}</span>
              <button type="button" data-action="increase" data-id="${item.productoId}">+</button>
            </div>
          </div>
        `).join('');
      }

      async function submitQuoteRequest(event) {
        event.preventDefault();

        if (!state.cart.length) {
          notify('Agrega al menos un producto para simular una cotización.', 'error');
          return;
        }

        const name = $('#catalog-client-name').value.trim();
        const email = $('#catalog-client-email').value.trim();
        const notes = $('#catalog-notes').value.trim();

        if (!name || !email) {
          notify('Completa nombre y correo para continuar.', 'error');
          return;
        }

        try {
          await fetch('/api/cotizaciones/guest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              clienteNombre: "Solicitud Web - Cliente",
              clienteEmail: email,
              notas: notes,
              items: state.cart.map(item => ({ productoId: item.productoId, cantidad: item.cantidad }))
            })
          });
        } catch (error) {
          console.error("Error al guardar en el historial:", error);
        }

        const total = state.cart.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
        let mensaje = "Hola, me interesa solicitar la siguiente cotización:\n\n";
        state.cart.forEach(item => {
          const subtotal = item.precio * item.cantidad;
          mensaje += `- ${item.cantidad}x ${item.nombre} - ${formatMoney(subtotal)}\n`;
        });
        mensaje += `\nTotal: ${formatMoney(total)}`;

        const urlWhatsApp = `https://wa.me/50249397276?text=${encodeURIComponent(mensaje)}`;
        window.open(urlWhatsApp, '_blank');

        notify(`Gracias ${name}. Un asesor revisará tu cotización y se pondrá en contacto contigo.`, 'success');
        event.target.reset();
        state.cart = [];
        renderCart();
      }

      function formatMoney(value) {
        return money.format(Number(value) || 0).replace('GTQ', 'Q');
      }

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      }

      let toastTimer;
      function notify(message, type = 'success') {
        const toast = $('#toast');
        toast.textContent = message;
        toast.className = `toast ${type} show`;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.className = 'toast';
        }, 3800);
      }
    </script>
  </body>
</html>
